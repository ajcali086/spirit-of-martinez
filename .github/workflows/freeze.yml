# IDs freeze at first publish. A push to main (a merged pull request, a CMS
# publish, or the curator's own commit) is a publish: this adds every new ID
# to src/model/frozen.json, and a fingerprint of every new passage or caption
# to src/data/published-text.json. It doesn't push to main: it puts the frozen IDs on
# the `freeze-ids` branch and opens a pull request for the curator to merge
# (or updates the one already open). Until that merges, the new IDs are
# provisional.
#
# Needs Settings → Actions → General → "Allow GitHub Actions to create and
# approve pull requests".
name: Freeze new IDs

on:
  push:
    branches: [main]
    paths: ["src/model/**", "src/data/chapters.ts", "src/data/photos.ts", "src/data/corrections/**"]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: freeze
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    env:
      BASE: main
      HEAD_BRANCH: freeze-ids
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:model
      - run: npm run freeze:model
      - name: Open or update the freeze pull request
        run: |
          if git diff --quiet src/model/frozen.json src/data/published-text.json; then
            echo "Nothing new to freeze."
            exit 0
          fi
          new=$(node -e '
            const before = JSON.parse(require("child_process").execSync("git show HEAD:src/model/frozen.json"));
            const after = JSON.parse(require("fs").readFileSync("src/model/frozen.json", "utf8"));
            const ids = (o) => Object.values(o).filter(Array.isArray).flat().length;
            console.log(ids(after) - ids(before));
          ')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$HEAD_BRANCH"
          git add src/model/frozen.json src/data/published-text.json
          git commit -m "Freeze IDs published in ${GITHUB_SHA::7}"
          # The branch is the bot's own: rebuilt from the latest publish each time.
          git push --force origin "$HEAD_BRANCH"
          body="Freezes ${new} ID(s) first published in ${GITHUB_SHA::7}. Merge it to freeze them: from then on the model's checks refuse to let them go missing or be reused. Made by .github/workflows/freeze.yml."
          if [ -n "$(gh pr list --head "$HEAD_BRANCH" --base "$BASE" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$HEAD_BRANCH" --body "$body"
            echo "Updated the open freeze pull request."
          else
            gh pr create --base "$BASE" --head "$HEAD_BRANCH" --title "Freeze newly published IDs" --body "$body"
          fi
