name: Make responsive images

# Runs the image script and commits the results, so it works from a phone:
# GitHub app or site > Actions > "Make responsive images" > Run workflow.
# It also runs when files under public/images change.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public/images/**"
      - "scripts/make-responsive-images.mjs"

jobs:
  build:
    # Skip runs caused by this workflow's own commit.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Make responsive images
        run: node scripts/make-responsive-images.mjs

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images src/generated/responsive-images.json
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Update responsive images"
            git push
          fi
